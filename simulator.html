<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Traffic Scheduler — Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="simulator-page" style="display:flex;flex-direction:column;min-height:100vh">
  <!-- Top Bar -->
  <header class="topbar">
    <div class="title">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary)"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <h1>Smart Traffic Scheduler</h1>
    </div>
    <a href="index.html" class="btn btn-ghost btn-sm">← Home</a>
    <div class="algo-group">
      <button class="btn btn-ghost btn-sm active" data-algo="round-robin">Round Robin</button>
      <button class="btn btn-ghost btn-sm" data-algo="edf">EDF</button>
      <button class="btn btn-ghost btn-sm" data-algo="compare">Compare Both</button>
    </div>
    <div class="controls">
      <button id="btn-reset" class="btn btn-outline btn-sm" title="Reset">↺</button>
      <button id="btn-start" class="btn btn-primary btn-sm">▶ Start</button>
      <button id="btn-pause" class="btn btn-secondary btn-sm" style="display:none">⏸ Pause</button>
      <div class="speed-control">
        <label>Speed</label>
        <input type="range" id="speed-slider" min="1" max="10" value="3">
      </div>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="sim-layout" style="flex:1">
    <!-- Left Panel -->
    <div class="left-panel">
      <!-- Intersection -->
      <div class="card intersection-wrapper">
        <div class="intersection-info">
          <span class="text-muted">Time:</span>
          <span class="time" id="sim-time">0</span>
          <span id="active-task-badge" class="task-badge" style="display:none"></span>
        </div>
        <div class="intersection">
          <div class="road-v"></div>
          <div class="road-h"></div>
          <div class="road-center"></div>
          <div class="lane-v"></div>
          <div class="lane-h"></div>
          <!-- Traffic Lights -->
          <div class="traffic-light tl-north">
            <span class="dir-label">N</span>
            <div class="tl-box">
              <div class="tl-bulb on-red" data-color="red"></div>
              <div class="tl-bulb" data-color="yellow"></div>
              <div class="tl-bulb" data-color="green"></div>
            </div>
          </div>
          <div class="traffic-light tl-south">
            <span class="dir-label">S</span>
            <div class="tl-box">
              <div class="tl-bulb on-red" data-color="red"></div>
              <div class="tl-bulb" data-color="yellow"></div>
              <div class="tl-bulb" data-color="green"></div>
            </div>
          </div>
          <div class="traffic-light tl-west">
            <span class="dir-label">W</span>
            <div class="tl-box">
              <div class="tl-bulb on-red" data-color="red"></div>
              <div class="tl-bulb" data-color="yellow"></div>
              <div class="tl-bulb" data-color="green"></div>
            </div>
          </div>
          <div class="traffic-light tl-east">
            <span class="dir-label">E</span>
            <div class="tl-box">
              <div class="tl-bulb on-red" data-color="red"></div>
              <div class="tl-bulb" data-color="yellow"></div>
              <div class="tl-bulb" data-color="green"></div>
            </div>
          </div>
          <div id="vehicle" class="vehicle" style="display:none"></div>
        </div>
        <div class="dir-statuses">
          <div class="dir-status status-north"><div class="dir-dot red"></div><span class="text-muted">NORTH:</span><span class="dir-state">RED</span></div>
          <div class="dir-status status-south"><div class="dir-dot red"></div><span class="text-muted">SOUTH:</span><span class="dir-state">RED</span></div>
          <div class="dir-status status-east"><div class="dir-dot red"></div><span class="text-muted">EAST:</span><span class="dir-state">RED</span></div>
          <div class="dir-status status-west"><div class="dir-dot red"></div><span class="text-muted">WEST:</span><span class="dir-state">RED</span></div>
        </div>
      </div>

      <!-- Task Table -->
      <div class="card task-config">
        <div class="task-config-header">
          <h2>Task Configuration</h2>
          <div class="actions">
            <button id="btn-random" class="btn btn-outline btn-sm">🔀 Randomize</button>
            <button id="btn-add" class="btn btn-primary btn-sm">+ Add</button>
          </div>
        </div>
        <div class="quantum-row">
          <label>Time Quantum (RR):</label>
          <input type="number" id="quantum-input" min="1" max="10" value="2">
        </div>
        <div class="task-table-wrap">
          <table>
            <thead>
              <tr><th>Name</th><th>Type</th><th>Dir</th><th>Arrive</th><th>Burst</th><th>Deadline</th><th>Wait</th><th></th></tr>
            </thead>
            <tbody id="task-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <div id="rr-section">
        <div id="rr-gantt"></div>
        <div id="rr-metrics"></div>
      </div>
      <div id="edf-section">
        <div id="edf-gantt"></div>
        <div id="edf-metrics"></div>
      </div>
      <div id="comparison"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
